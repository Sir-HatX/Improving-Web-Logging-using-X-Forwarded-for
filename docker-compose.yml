version: '3.8'

networks:
  web_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1 

services:
  
  nginx_api:
    build: 
      context: ./nginx_api  # Build the Nginx container with Python
    container_name: nginx_api
    networks:
      web_network:
       ipv4_address: 172.30.0.10
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
    depends_on: []

  haproxy:
    image: haproxy:latest
    container_name: haproxy
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      web_network:
       ipv4_address: 172.30.0.9
    ports:
      - "6000:80"
    depends_on:
      - nginx_api

  nginx_web:
    image: openresty/openresty:latest
    container_name: nginx_web
    volumes:
      - ./nginx_web.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
    networks:
      web_network:
       ipv4_address: 172.30.0.8
    ports:
      - "7000:80"
    depends_on:
      - haproxy

  nginx_lb:
    image: nginx:latest
    container_name: nginx_lb
    volumes:
      - ./nginx_lb.conf:/etc/nginx/nginx.conf:ro
    networks:
      web_network:
       ipv4_address: 172.30.0.7
    ports:
      - "8000:80"
    depends_on:
      - nginx_web
