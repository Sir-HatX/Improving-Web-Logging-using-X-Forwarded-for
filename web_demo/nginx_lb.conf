worker_processes auto;
events {
    worker_connections 1024;
}

http {
    # MIME types and default settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging real IPs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Load balancing upstream
    upstream nginx_web_backend {
        server nginx_web:80;  # Single instance, scale by adding more
        # server nginx_web_2:80; # Uncomment if you add another instance
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://nginx_web_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (optional)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }

        # Health Check (optional)
        location /health {
            return 200 "OK";
            access_log off;
        }
    }
}
